
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warehouse Allocation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Warehouse Allocation</h2>
            <p class="text-muted">Allocate pending orders to available warehouses.</p>
        </div>
        <a href="/" class="btn btn-outline-secondary">Dashboard</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>Pending Orders</h5>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Destination</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
            <p id="emptyMessage" class="text-muted"></p>
        </div>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <div id="resultCard" class="card shadow-sm d-none">
        <div class="card-body">
            <h5>Allocation Result</h5>
            <p id="resultOrder"></p>

            <table class="table">
                <thead>
                    <tr>
                        <th>Warehouse ID</th>
                        <th>SKU</th>
                        <th>Allocated Quantity</th>
                    </tr>
                </thead>
                <tbody id="allocationTable"></tbody>
            </table>

            <a href="/" class="btn btn-primary">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    const cookie = document.cookie.split("; ")
        .find(row => row.startsWith(name + "="));

    return cookie
        ? decodeURIComponent(cookie.substring(name.length + 1))
        : "";
}

function showMessage(message, type = "info") {
    const el = document.getElementById("message");
    el.className = `alert alert-${type}`;
    el.textContent = message;
}

async function loadOrders() {
    try {
        const response = await fetch("/api/orders/", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Could not load orders. HTTP " + response.status);
        }

        const data = await response.json();
        const orders = Array.isArray(data) ? data : data.results;

        if (!Array.isArray(orders)) {
            throw new Error("Unexpected API response.");
        }

        const pending = orders.filter(
            order => order.status === "PENDING"
        );

        const tbody = document.getElementById("ordersTable");
        tbody.replaceChildren();

        for (const order of pending) {
            const tr = document.createElement("tr");

            for (const value of [
                order.order_id,
                order.customer_name,
                order.destination_city
            ]) {
                const td = document.createElement("td");
                td.textContent = value ?? "";
                tr.appendChild(td);
            }

            const actionCell = document.createElement("td");
            const button = document.createElement("button");
            button.className = "btn btn-primary btn-sm";
            button.textContent = "Allocate";

            button.addEventListener("click", () => {
                allocateOrder(order.order_id, button);
            });

            actionCell.appendChild(button);
            tr.appendChild(actionCell);
            tbody.appendChild(tr);
        }

        document.getElementById("emptyMessage").textContent =
            pending.length ? "" : "No pending orders found.";

    } catch (error) {
        showMessage(error.message, "danger");
    }
}

async function allocateOrder(orderId, button) {
    button.disabled = true;
    document.getElementById("resultCard").classList.add("d-none");

    try {
        const response = await fetch(
            `/api/orders/${encodeURIComponent(orderId)}/allocate/`,
            {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({})
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || data.detail || "Allocation failed"
            );
        }

        showMessage("Warehouse allocation successful!", "success");

        document.getElementById("resultOrder").textContent =
            `Order: ${data.order_id} | Status: ${data.status}`;

        const tbody = document.getElementById("allocationTable");
        tbody.replaceChildren();

        for (const allocation of data.allocations) {
            const tr = document.createElement("tr");

            for (const value of [
                allocation.node_id,
                allocation.sku_id,
                allocation.quantity
            ]) {
                const td = document.createElement("td");
                td.textContent = value;
                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        }

        document.getElementById("resultCard")
            .classList.remove("d-none");

        await loadOrders();

    } catch (error) {
        showMessage(error.message, "danger");
    } finally {
        button.disabled = false;
    }
}

document.addEventListener("DOMContentLoaded", loadOrders);
</script>
</body>
</html>
