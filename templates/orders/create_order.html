
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Order - Fulfillment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 750px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3>Create Customer Order</h3>
            <p class="text-muted">Enter order and product details.</p>

            <form id="orderForm">
                <div class="mb-3">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input id="customerName" class="form-control" required maxlength="150">
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">Destination City</label>
                    <input id="city" class="form-control" value="Hyderabad" required>
                </div>

                <div class="mb-3">
                    <label for="zone" class="form-label">Destination Zone</label>
                    <input id="zone" class="form-control" value="HYD" required>
                </div>

                <div class="mb-3">
                    <label for="sku" class="form-label">Product SKU</label>
                    <input id="sku" class="form-control" value="SKU-000001" required>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input id="quantity" type="number" class="form-control" min="1" value="1" required>
                </div>

                <button id="submitBtn" class="btn btn-primary" type="submit">
                    Create Order
                </button>

                <a href="/" class="btn btn-outline-secondary">Dashboard</a>
            </form>

            <div id="result" class="mt-3" role="status" aria-live="polite"></div>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    const cookie = document.cookie.split("; ")
        .find(row => row.startsWith(name + "="));
    return cookie ? decodeURIComponent(cookie.split("=")[1]) : "";
}

document.getElementById("orderForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("submitBtn");
    const result = document.getElementById("result");
    button.disabled = true;
    result.textContent = "Creating order...";

    const payload = {
        customer_name: document.getElementById("customerName").value.trim(),
        destination_city: document.getElementById("city").value.trim(),
        destination_zone: document.getElementById("zone").value.trim().toUpperCase(),
        lines: [{
            sku: document.getElementById("sku").value.trim(),
            quantity: Number(document.getElementById("quantity").value)
        }]
    };

    try {
        const response = await fetch("/api/orders/", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(JSON.stringify(data));
        }

        result.className = "alert alert-success mt-3";
        result.textContent = "Order created: " + data.order_id;
        document.getElementById("orderForm").reset();

    } catch (error) {
        result.className = "alert alert-danger mt-3";
        result.textContent = "Unable to create order: " + error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
